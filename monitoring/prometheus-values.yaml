# kube-prometheus-stack Helm values
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: false   # Keep lean for local

grafana:
  enabled: false   # Deployed separately

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
